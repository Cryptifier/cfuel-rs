[package]
name = "fuel"
version = "0.1.0"
edition = "2024"

[dependencies]
bigdecimal = { version = "0.4", features = ["serde"] }
num-bigint = { version = "0.4", default-features = false, features = ["std", "serde"] }
num-integer = "0.1"
num-traits = "0.2"
rand = "0.8.5"
rand_chacha = "0.3.1"
rayon = "1.10"

[dev-dependencies]
insta = { version = "1.38.0", features = ["yaml"] }
serde_json = "1.0"

[features]
default = []
aarch64-hamming-accel = []
x86-hamming-accel = []
